server:
  port: 8082

spring:
    application:
        name: ms-pedidos360-catalog
    main:
      web-application-type: reactive

    r2dbc:
      url: r2dbc:${DB_URL:postgresql://localhost:5432/ms-catalog?scheme=catalog}
      username: ${DB_USER:postgres}
      password: ${DB_PASSWORD:root}

    flyway:
      enabled: true
      url: jdbc:${DB_URL:postgresql://localhost:5432/ms-catalog}
      password: ${DB_PASSWORD:root}
      user: ${DB_USER:postgres}
      baseline-on-migrate: true
      schemas: catalog
      default-schema: catalog

    output:
      ansi:
        enabled: always