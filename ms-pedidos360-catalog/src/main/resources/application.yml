server:
  port: 8082

spring:
    application:
        name: ms-pedidos360-catalog
    main:
      web-application-type: reactive

    kafka:
      bootstrap-servers: ${KAFKA_BROKER_URL:localhost:9092,localhost:9093,localhost:9094}
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
        properties:
          spring.json.add.type.headers: false

    r2dbc:
      url: r2dbc:${DB_URL:postgresql://localhost:5432/ms-catalog?schema=catalog}
      username: ${DB_USER:postgres}
      password: ${DB_PASSWORD:root}

    flyway:
      enabled: true
      url: jdbc:${DB_URL:postgresql://localhost:5432/ms-catalog}
      password: ${DB_PASSWORD:root}
      user: ${DB_USER:postgres}
      baseline-on-migrate: true
      schemas: catalog
      default-schema: catalog

    output:
      ansi:
        enabled: always

    sql:
      init:
        mode: always

cloudinary:
  credentials: ${CLOUDINARY_URL}

kafka:
  topics:
    orders: orders.events
    audit: audit.timeline
