services:
  activemq1:
    image: rmohr/activemq:latest
    container_name: pedidos360-activemq1
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      - ACTIVEMQ_OPTS_MEMORY=-Xms64m -Xmx256m
    volumes:
      - ./activemq.xml:/opt/activemq/conf/activemq.xml
    networks:
      - activemq-net

  activemq2:
    image: rmohr/activemq:latest
    container_name: pedidos360-activemq2
    ports:
      - "61617:61616"
      - "8162:8161"
    environment:
      - ACTIVEMQ_OPTS_MEMORY=-Xms64m -Xmx256m
    volumes:
      - ./activemq.xml:/opt/activemq/conf/activemq.xml
    networks:
      - activemq-net

networks:
  activemq-net:
    driver: bridge