spring:
  application:
    name: ms-pedidos360-order

  r2dbc:
    # Usamos ?schema= en lugar de ?currentSchema= para R2DBC
    url: r2dbc:${DB_URL:postgresql://localhost:5432/ms-orders}?schema=orders
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}

  flyway:
    url: jdbc:${DB_URL:postgresql://localhost:5432/ms-orders}?currentSchema=orders
    password: ${DB_PASSWORD:root}
    user: ${DB_USER:postgres}
    baseline-on-migrate: true
    default-schema: orders

  output:
    ansi:
      enabled: always

  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:failover:(tcp://localhost:61616,tcp://localhost:61617)?randomize=false}
    user: admin
    password: admin

server:
  port: 8081

logging:
  level:
    org:
      springframework:
        r2dbc: DEBUG

broker:
  queues:
    email: "q.cmd.email"
    kitchen: "q.cmd.kitchen"
    invoice: "q.cmd.invoice"
  topics:
    orders: "VirtualTopic.Orders"

