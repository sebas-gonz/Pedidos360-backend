spring:
  application:
    name: ms-pedidos360-order

  r2dbc:
    url: r2dbc:${DB_URL:postgresql://localhost:5432/ms-orders?scheme=orders}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}

  flyway:
    url: jdbc:${DB_URL:postgresql://localhost:5432/ms-orders}
    password: ${DB_PASSWORD:root}
    user: ${DB_USER:postgres}
    baseline-on-migrate: true
    default-schema: orders

  output:
    ansi:
      enabled: always

  activemq:
    broker-url: tcp:${ACTIVEMQ_BROKER_URL://localhost:61616}
    user: admin
    password: admin

server:
  port: 8081

logging:
  level:
    org:
      springframework:
        r2dbc: DEBUG

