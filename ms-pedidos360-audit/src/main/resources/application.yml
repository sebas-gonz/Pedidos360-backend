spring:
  application:
    name: ms-pedidos360-audit

  r2dbc:
    url: r2dbc:${DB_URL:postgresql://localhost:5432/ms-audit?scheme=audit}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}

  flyway:
    url: jdbc:${DB_URL:postgresql://localhost:5432/ms-audit}
    password: ${DB_PASSWORD:root}
    user: ${DB_USER:postgres}
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: audit

  output:
    ansi:
      enabled: always

logging:
  level:
    org:
      springframework:
        r2dbc: DEBUG

server:
  port: 8085
