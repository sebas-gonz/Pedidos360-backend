spring:
  kafka:
    bootstrap-servers: ${KAFKA_BROKER_URL:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      group-id: report-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  application:
    name: ms-pedidos360-report
  r2dbc:
    url: r2dbc:${DB_URL:postgresql://localhost:5432/ms-reports?search_path=reports}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}

  flyway:
    url: jdbc:${DB_URL:postgresql://localhost:5432/ms-reports}
    user: ${spring.r2dbc.username}
    password: ${spring.r2dbc.password}
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: reports

  output:
    ansi:
      enabled: always

server:
  port: 8084

logging:
  level:
    org:
      springframework:
        r2dbc: DEBUG
kafka:
  topics:
    orders: orders.events

