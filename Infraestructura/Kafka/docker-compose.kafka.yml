
x-zookeeper-env: &zookeeper-env
  ZOO_SERVERS: zookeeper1:2888:3888,zookeeper2:2888:3888,zookeeper3:2888:3888
  ALLOW_ANONYMOUS_LOGIN: "yes"

x-zookeeper-common: &zookeeper-common
  image: bitnami/zookeeper:3.8

x-kafka-env: &kafka-env
  KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  ALLOW_PLAINTEXT_LISTENER: "yes"
  KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL

x-kafka-common: &kafka-common
  image: bitnami/kafka:3.4
  depends_on:
    - zookeeper1
    - zookeeper2
    - zookeeper3

services:
  # Nodos Zookeeper
  zookeeper1:
    <<: *zookeeper-common
    container_name: pedidos360-zookeeper1
    environment:
      <<: *zookeeper-env
      ZOO_SERVER_ID: 1

  zookeeper2:
    <<: *zookeeper-common
    container_name: pedidos360-zookeeper2
    environment:
      <<: *zookeeper-env
      ZOO_SERVER_ID: 2

  zookeeper3:
    <<: *zookeeper-common
    container_name: pedidos360-zookeeper3
    environment:
      <<: *zookeeper-env
      ZOO_SERVER_ID: 3

  # Nodos Brokers Kafka
  kafka1:
    <<: *kafka-common
    container_name: pedidos360-kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092

  kafka2:
    <<: *kafka-common
    container_name: pedidos360-kafka2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_CFG_LISTENERS: INTERNAL://:29093,EXTERNAL://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka2:29093,EXTERNAL://localhost:9093

  kafka3:
    <<: *kafka-common
    container_name: pedidos360-kafka3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_CFG_LISTENERS: INTERNAL://:29094,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka3:29094,EXTERNAL://localhost:9094

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pedidos360-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "Pedidos360-Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:29092,kafka2:29093,kafka3:29094"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
    depends_on:
      - kafka1
      - kafka2
      - kafka3

  kafka-init:
    image: bitnami/kafka:3.4
    container_name: pedidos360-kafka-init
    depends_on:
      - kafka1
      - kafka2
      - kafka3